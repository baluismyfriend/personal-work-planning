<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
<title>Participant - Spaces & Time - Final Secure Portal</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Participant">
</head>
<body>
<div id="app" class="app">
  <header class="site-header">
    <div class="header-row">
      <button id="navSpacesBtn" type="button" class="nav-btn nav-btn-spaces"></button>
      <div class="brand">
        <div class="brand-icon">PST</div>
        <div class="brand-text">
          <h1>Spaces & Time</h1>
          <div class="brand-subtitle">Local secure timeframe portal</div>
        </div>
      </div>
      <button id="navNoSpaceBtn" type="button" class="nav-btn nav-btn-nospace"></button>
    </div>
    <nav id="nav" class="nav" aria-label="Workbook pages"></nav>
  </header>

  <main class="content">
    <div class="top-row">
      <div class="title-block">
        <div class="eyebrow">CURRENT PAGE</div>
        <h2 id="pageTitle">&nbsp;</h2>
        <div id="rowCountIndicator" class="row-count-indicator" hidden></div>
      </div>
      <div class="actions">
        <button id="btnAddRow" type="button" class="btn" title="Add a new space">+ Add</button>
        <button id="btnRefreshWeek" type="button" class="btn" title="Rebuild this page from the Spaces and Times pages" hidden>&#8635; Refresh</button>
        <button id="btnExportJson" type="button" class="btn" title="Export the whole workbook as a JSON backup">Export</button>
        <button id="btnAutoBackup" type="button" class="btn" title="Enable Auto Backup">Backup</button>
        <button id="btnImportJson" type="button" class="btn" title="Import a JSON backup">Import</button>
        <input id="fileImport" type="file" accept="application/json,.json" class="hidden-input" tabindex="-1">
        <button id="btnExportCsv" type="button" class="btn" title="Export the current page as CSV">CSV</button>
        <button id="btnResetSheet" type="button" class="btn btn-danger" title="Clear all rows on this page">Reset</button>
      </div>
    </div>

    <div class="table-card">
      <div id="tableScroller" class="table-scroller">
        <table id="dataTable" class="data-table">
          <colgroup id="colgroup"></colgroup>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div id="taskSwipeNav" class="task-swipe-nav" hidden>
      <button type="button" id="taskPrevBtn" class="task-nav-btn">&#8249; BackIn</button>
      <div id="taskPositionLabel" class="task-position">0 of 0</div>
      <button type="button" id="taskNextBtn" class="task-nav-btn">NextIn &#8250;</button>
    </div>
  </main>

  <button id="btnAddRowFloating" type="button" class="btn btn-primary floating-add" title="Add Space">+ Add Space</button>

  <div id="backupPrompt" class="backup-prompt" hidden role="status" aria-live="polite">
    <div class="backup-prompt-text">
      <strong>Daily backup reminder</strong>
      <span>You haven't exported a backup today. Save a fresh copy to keep your data safe.</span>
    </div>
    <div class="backup-prompt-actions">
      <button id="backupPromptExportBtn" type="button" class="btn btn-primary">Export now</button>
      <button id="backupPromptDismissBtn" type="button" class="btn">Not today</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
